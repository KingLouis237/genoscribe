[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genoscribe"
version = "0.1.0"
description = "GenoScribe: a local evidence-review workbench for genomics papers and technical documents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.84.0",
  "pypdf>=6.7.5",
  "rich>=13.7.0",
  "streamlit>=1.32.0",
  "scikit-learn>=1.5.0",
  "sentence-transformers>=2.5.1",
  "faiss-cpu>=1.8.0.post1",
]

[project.optional-dependencies]
docling = ["docling"]

[project.scripts]
genoscribe = "genoscribe.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["genoscribe*"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
